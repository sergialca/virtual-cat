[project]
name = "virtual-cat-agent"
version = "0.1.0"
description = "LiveKit voice agent for the 2D cat assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "livekit-agents>=1.2.0",
  "livekit-plugins-openai>=1.2.0",
  "livekit-plugins-silero>=1.2.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
virtual-cat-agent = "main:run"
